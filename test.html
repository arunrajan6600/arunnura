<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Swap on Hover</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
      }

      .image-container {
        width: 300px;
        height: 300px;
        position: relative;
      }

      .image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        transition: opacity 0.3s ease;
      }

      .image-container img:first-child {
        z-index: 1;
      }

      .image-container img:hover {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="image-container">
      <img
        src="/Users/vivekmnair/Downloads/nura_website/public/images/monKEY.png"
        alt="Modern Workspace"
      />
      <img
        src="/Users/vivekmnair/Downloads/nura_website/public/images/manKEY.png"
        alt="Wireframe Design"
      />
    </div>
  </body>
</html>
